[project]
name = "install-in-claude"
version = "0.1.0"
description = "Link a project's Claude Code files into ~/.claude and merge its settings.json entries"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cappa>=0.33.0",
]

[project.scripts]
install-in-claude = "install_in_claude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/install_in_claude"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 160

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# B: flake8-bugbear
# E: pycodestyle
# F: Pyflakes
# I: isort
# ICN: import convention
# S: bandit
# SIM: flake8-simplify
# TID: tidy imports
select = [
    "B",
    "E",
    "F",
    "I",
    "ICN",
    "S",
    "SIM",
    "TID",
]
# E501: line length is left to the formatter
# SIM108: an if-else block can read better than a ternary
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = [
    "S101", # asserts in tests
]

[tool.ruff.lint.isort]
known-first-party = ["install_in_claude"]
