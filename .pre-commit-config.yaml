repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Matches the ruff in uv.lock.
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  # This repository serves many projects, so no file or commit message names
  # one. The names hook is published by the auditor repository and reads a
  # list kept outside every repository.
  - repo: https://github.com/bnomis/auditor
    rev: 133ca2c819d32fbc369ff921c1eba491ab36e222
    hooks:
      - id: no-project-names
        args: [--allow=install-in-claude]
      - id: auditme-changed
      - id: auditme-all
        stages: [manual, pre-push]
