repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Matches the ruff in uv.lock.
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  # This repository serves many projects, so no file or commit message names
  # one. The names hook is published by the agents repository and reads a
  # list kept outside every repository.
  - repo: git@github.com:bnomis/agents.git
    rev: 0394f33ad0a93344a9d387a399225c0dca94a955
    hooks:
      - id: no-project-names
        args: [--allow=install-in-claude]
